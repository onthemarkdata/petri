[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "petri-grow"
dynamic = ["version"]
description = "An agent orchestration framework to grow your AI's context."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "On the Mark Data LLC"}]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "croniter>=6.0,<7",
    "dbos[otel]==3.4.0",
    "filelock>=3.16",
    "pydantic-ai>=2.64,<3",


    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "pyyaml>=6.0",
    "typer>=0.9",
    "questionary>=2.0",
    "fastapi>=0.100",
    "sse-starlette>=1.6",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "pytest-cov>=5.0",
]
dev = ["mypy>=1.11", "pre-commit>=3.7"]
all = ["petri-grow[pdf,test,dev]"]

[project.scripts]
petri = "petri.cli:app"

[project.urls]
Homepage = "https://github.com/onthemarkdata/petri"
Repository = "https://github.com/onthemarkdata/petri"

[tool.setuptools.packages.find]
include = ["petri*"]

[tool.setuptools.package-data]
petri = [
    "defaults/*.yaml",
    "defaults/*.md",
    "templates/*.txt",
    "templates/*.html",
    "assets/**/*",
    "storage/migrations/*.sql",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.mypy]
# Intentionally lenient on a largely untyped codebase; tightened per-module over time.
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "live: opt-in local model inference; disabled unless explicitly enabled",
    "integration: may reach the real network or a real CLI; bypasses the offline guard (run explicitly with `pytest -m integration`)",
    "live: explicitly enabled configured-model evaluation; never runs in CI",
    "private_archive: opt-in local checks of a separately supplied private archive",
]
